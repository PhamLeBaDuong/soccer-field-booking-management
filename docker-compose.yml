# Service-oriented stack: each bounded context runs as its own container.
# Spin up the full platform with:   docker compose up --build -d
# All services share one Postgres instance for now (distributed compute,
# shared data). The gateway (nginx:8080) is the single public entry point.
# Config values live in .env — see .env.example.
#
# Service map:
#   db       – Postgres 16 (shared data store)
#   server   – Monolith shell: Socket.io + root health check only
#   worker   – Background cleanup sweep (extracted from the monolith)
#   catalog  – /api/fields  /api/venues
#   auth     – /api/auth  /api/users  /api/admin
#   booking  – /api/bookings  /api/webhooks
#   social   – /api/friends  /api/messages  /api/invites
#   match    – /api/matches  /api/match-posts  /api/lobbies  /api/teams
#   gateway  – nginx reverse-proxy (port 8080 → all upstreams above)
#   web      – Next.js frontend (port 3000, calls the gateway)

# ── Reusable fragments ─────────────────────────────────────────────────────────

# All service containers share these env vars.
x-service-env: &service-env
  DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/soccer_booking?schema=public"
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
  CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
  NODE_ENV: dev

# All service containers depend on the DB being healthy before they start.
x-db-dep: &db-dep
  db:
    condition: service_healthy

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: soccer_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Monolith shell ─────────────────────────────────────────────────────────────
  # Hosts Socket.io (real-time chat & notifications) and the root health check.
  # All REST paths have been extracted to dedicated services below; the gateway
  # falls back here only for unmatched locations (/ and /socket.io/).
  server:
    build: ./server
    image: soccer-server
    environment:
      <<: *service-env
      PORT: "5000"
      CLEANUP_ENABLED: "false"  # Cleanup runs in its own `worker` container.
    # No host port — reachable only through the gateway on :8080.
    depends_on: *db-dep
    restart: unless-stopped

  # ── Worker ────────────────────────────────────────────────────────────────────
  # Background cleanup sweep — same image as `server`, different entrypoint.
  # Decoupled from the API so a slow sweep never blocks a request.
  worker:
    build: ./server
    image: soccer-server
    command: ["node", "src/worker.js"]
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/soccer_booking?schema=public"
      CLEANUP_INTERVAL_MIN: ${CLEANUP_INTERVAL_MIN:-30}
    depends_on: *db-dep
    restart: unless-stopped

  # ── Catalog service ───────────────────────────────────────────────────────────
  # Owns: /api/fields  /api/venues
  # Responsibility: field & venue inventory (search, availability, metadata).
  catalog:
    build: ./server
    image: soccer-server
    command: ["node", "src/service.js"]
    environment:
      <<: *service-env
      SERVICE: catalog
      PORT: "5000"
    depends_on: *db-dep
    restart: unless-stopped

  # ── Auth service ──────────────────────────────────────────────────────────────
  # Owns: /api/auth  /api/users  /api/admin
  # Responsibility: registration, login, JWT issuance, user profiles, admin ops.
  auth:
    build: ./server
    image: soccer-server
    command: ["node", "src/service.js"]
    environment:
      <<: *service-env
      SERVICE: auth
      PORT: "5000"
    depends_on: *db-dep
    restart: unless-stopped

  # ── Booking service ───────────────────────────────────────────────────────────
  # Owns: /api/bookings  /api/webhooks
  # Responsibility: field reservations, slot management, payment processing
  # (Stripe, PayPal, MoMo, VNPay, ZaloPay) and their inbound webhook callbacks.
  # Payment provider env vars are optional — only needed when that provider is used.
  booking:
    build: ./server
    image: soccer-server
    command: ["node", "src/service.js"]
    environment:
      <<: *service-env
      SERVICE: booking
      PORT: "5000"
      # ── Stripe ──────────────────────────────────────────────────────────────
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      # ── PayPal ──────────────────────────────────────────────────────────────
      PAYPAL_CLIENT_ID:       ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET:   ${PAYPAL_CLIENT_SECRET:-}
      # ── MoMo ────────────────────────────────────────────────────────────────
      MOMO_PARTNER_CODE:      ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY:        ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY:        ${MOMO_SECRET_KEY:-}
      # ── VNPay ───────────────────────────────────────────────────────────────
      VNPAY_TMN_CODE:         ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET:      ${VNPAY_HASH_SECRET:-}
      # ── ZaloPay ─────────────────────────────────────────────────────────────
      ZALOPAY_APP_ID:         ${ZALOPAY_APP_ID:-}
      ZALOPAY_KEY1:           ${ZALOPAY_KEY1:-}
      ZALOPAY_KEY2:           ${ZALOPAY_KEY2:-}
    depends_on: *db-dep
    restart: unless-stopped

  # ── Social service ────────────────────────────────────────────────────────────
  # Owns: /api/friends  /api/messages  /api/invites
  # Responsibility: friend graph, REST chat history, team invitations.
  # Real-time delivery still goes through Socket.io on the monolith shell.
  social:
    build: ./server
    image: soccer-server
    command: ["node", "src/service.js"]
    environment:
      <<: *service-env
      SERVICE: social
      PORT: "5000"
    depends_on: *db-dep
    restart: unless-stopped

  # ── Match service ─────────────────────────────────────────────────────────────
  # Owns: /api/matches  /api/match-posts  /api/lobbies  /api/teams
  # Responsibility: match lifecycle, public match-post board, open lobbies,
  # and team management.
  match:
    build: ./server
    image: soccer-server
    command: ["node", "src/service.js"]
    environment:
      <<: *service-env
      SERVICE: match
      PORT: "5000"
    depends_on: *db-dep
    restart: unless-stopped

  # ── API Gateway ───────────────────────────────────────────────────────────────
  # Single public entry point on :8080. Routes every /api/* path to the correct
  # upstream service; falls back to the monolith shell for /socket.io/ and /.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - server
      - catalog
      - auth
      - booking
      - social
      - match
    restart: unless-stopped

  # ── Web (Next.js frontend) ────────────────────────────────────────────────────
  # Browser talks to the gateway (:8080), never directly to a service container.
  web:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  pgdata:
