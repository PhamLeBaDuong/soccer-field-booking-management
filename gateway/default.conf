# API Gateway routing — single public entry point for the entire platform.
# Each bounded context runs in its own container; nginx fans requests out to the
# correct upstream (the strangler-fig pattern). The monolith is now only needed
# for Socket.io (real-time) until that is extracted too.
#
# Upstreams (all on port 5000 inside the Docker network):
upstream web      { server web:3000; }
upstream monolith { server server:5000; }  # ← shrinking: Socket.io + fallback
upstream catalog  { server catalog:5000; } # fields, venues
upstream auth     { server auth:5000;    } # auth, users, admin
upstream booking  { server booking:5000; } # bookings, payment webhooks
upstream social   { server social:5000;  } # friends, messages, invites
upstream match    { server match:5000;   } # matches, match-posts, lobbies, teams

# Needed so Socket.io's WebSocket upgrade is proxied correctly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Catalog service: field & venue inventory ──────────────────────────────
    location /api/fields  { proxy_pass http://catalog; }
    location /api/venues  { proxy_pass http://catalog; }

    # ── Auth service: identity, user profiles, admin panel ───────────────────
    location /api/auth    { proxy_pass http://auth; }
    location /api/users   { proxy_pass http://auth; }
    location /api/admin   { proxy_pass http://auth; }

    # ── Booking service: reservations + payment provider callbacks ────────────
    location /api/bookings { proxy_pass http://booking; }
    location /api/webhooks { proxy_pass http://booking; }

    # ── Social service: friends, direct messages, team invitations ────────────
    location /api/friends  { proxy_pass http://social; }
    location /api/messages { proxy_pass http://social; }
    location /api/invites  { proxy_pass http://social; }

    # ── Match service: matches, match-posts, lobbies, teams ───────────────────
    location /api/matches      { proxy_pass http://match; }
    location /api/match-posts  { proxy_pass http://match; }
    location /api/lobbies      { proxy_pass http://match; }
    location /api/teams        { proxy_pass http://match; }

    # ── Socket.io (real-time still lives on the monolith) ────────────────────
    location /socket.io/ {
        proxy_pass http://monolith;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── Fallback — monolith handles anything not yet extracted ────────────────
    location / { proxy_pass http://web; }
}
