<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation walkthrough</title><style>body{font:16px system-ui;margin:30px auto;max-width:1100px;padding:0 20px;background:#f5f5f4;color:#171717}figure{margin:30px 0;background:white;padding:20px;border-radius:12px}img{max-width:100%;height:auto;border:1px solid #ddd}figcaption{font-weight:600;margin-bottom:12px}</style><h1>PitchBook invitation demo</h1><p>Recorded from the actual app with isolated sample data. No remote database changes.</p><figure><figcaption>A signed-out visitor sees the team invitation and login/register choices.</figcaption><img src="01-guest.png" alt="A signed-out visitor sees the team invitation and login/register choices."></figure><figure><figcaption>Registration signs the visitor in and returns directly to Accept or Decline.</figcaption><img src="02-after-registration.png" alt="Registration signs the visitor in and returns directly to Accept or Decline."></figure><figure><figcaption>An explicit acceptance adds the new account to the team.</figcaption><img src="03-team-accepted.png" alt="An explicit acceptance adds the new account to the team."></figure><figure><figcaption>Team details show the single permanent invitation link with a Copy button.</figcaption><img src="03a-team-management.png" alt="Team details show the single permanent invitation link with a Copy button."></figure><figure><figcaption>A new user without a team creates one within the match invitation, then can accept.</figcaption><img src="03b-new-team.png" alt="A new user without a team creates one within the match invitation, then can accept."></figure><figure><figcaption>An existing user logs in, returns to the match request, and chooses a team they lead.</figcaption><img src="04-match-choice.png" alt="An existing user logs in, returns to the match request, and chooses a team they lead."></figure><figure><figcaption>Accepting the request creates the match and participant bookings.</figcaption><img src="05-match-accepted.png" alt="Accepting the request creates the match and participant bookings."></figure><figure><figcaption>The lobby link joins the signed-in player using the normal capacity checks.</figcaption><img src="06-lobby-joined.png" alt="The lobby link joins the signed-in player using the normal capacity checks."></figure><figure><figcaption>Declining records the response without creating a membership or booking.</figcaption><img src="07-declined.png" alt="Declining records the response without creating a membership or booking."></figure><figure><figcaption>Links keep their URL but a canceled match request blocks acceptance.</figcaption><img src="08-closed.png" alt="Links keep their URL but a canceled match request blocks acceptance."></figure><figure><figcaption>The invitation is usable on a narrow mobile screen.</figcaption><img src="09-mobile.png" alt="The invitation is usable on a narrow mobile screen."></figure><figure><figcaption>The owner sees the same permanent team URL; there is no invitation management dialog.</figcaption><img src="10-owner-link.png" alt="The owner sees the same permanent team URL; there is no invitation management dialog."></figure><figure><figcaption>The lobby creator sees one stable join URL with a Copy button.</figcaption><img src="11-lobby-link.png" alt="The lobby creator sees one stable join URL with a Copy button."></figure><figure><figcaption>The posting team's leader sees one stable match-request URL with a Copy button.</figcaption><img src="12-match-link.png" alt="The posting team's leader sees one stable match-request URL with a Copy button."></figure><figure><figcaption>The posting team's leader can cancel an open request after confirmation.</figcaption><img src="13-cancel-confirmation.png" alt="The posting team's leader can cancel an open request after confirmation."></figure><figure><figcaption>The request becomes canceled and can no longer be accepted.</figcaption><img src="14-request-canceled.png" alt="The request becomes canceled and can no longer be accepted."></figure></html>
