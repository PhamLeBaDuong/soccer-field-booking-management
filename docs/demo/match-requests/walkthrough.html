<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation walkthrough</title><style>body{font:16px system-ui;margin:30px auto;max-width:1100px;padding:0 20px;background:#f5f5f4;color:#171717}figure{margin:30px 0;background:white;padding:20px;border-radius:12px}img{max-width:100%;height:auto;border:1px solid #ddd}figcaption{font-weight:600;margin-bottom:12px}</style><h1>PitchBook invitation demo</h1><p>Recorded from the actual app with isolated sample data. No remote database changes.</p><figure><figcaption>Posting 18:30–20:30 creates an open request, uses the field timezone without extra database columns, and does not accept it.</figcaption><img src="01-posted-open.png" alt="Posting 18:30–20:30 creates an open request, uses the field timezone without extra database columns, and does not accept it."></figure><figure><figcaption>The same team can post a second request immediately next to the first one.</figcaption><img src="02-multiple-requests.png" alt="The same team can post a second request immediately next to the first one."></figure><figure><figcaption>An overlapping request is rejected without changing the existing requests.</figcaption><img src="03-overlap-blocked.png" alt="An overlapping request is rejected without changing the existing requests."></figure><figure><figcaption>The freshly posted request link remains available and offers login or registration.</figcaption><img src="04-fresh-invitation.png" alt="The freshly posted request link remains available and offers login or registration."></figure><figure><figcaption>The other team must explicitly accept; opening the link and signing in do not confirm a match.</figcaption><img src="05-waiting-for-acceptance.png" alt="The other team must explicitly accept; opening the link and signing in do not confirm a match."></figure><figure><figcaption>Only the opposing team's explicit acceptance confirms the match.</figcaption><img src="06-explicitly-accepted.png" alt="Only the opposing team's explicit acceptance confirms the match."></figure></html>
